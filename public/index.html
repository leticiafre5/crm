<!doctype html>
<html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>España Directa · CRM</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--navy:#002B5C;--red:#B20838;--yellow:#F4B400;--bg:#F7F9FC;--ink:#1D2939;--muted:#667085;--line:#E4E7EC;--green:#059669}*{box-sizing:border-box}body{margin:0;background:var(--bg);font:14px Inter,system-ui;color:var(--ink)}button,input,select,textarea{font:inherit}button{cursor:pointer;border:0;border-radius:8px;padding:10px 14px;background:var(--navy);color:white;font-weight:600}.app{display:flex;min-height:100vh}.side{width:245px;background:var(--navy);color:white;padding:24px 15px;flex-shrink:0}.brand{font-size:18px;font-weight:700;padding:0 12px 25px}.brand small{display:block;font-size:11px;font-weight:400;opacity:.7;margin-top:5px}.nav{padding:10px 12px;border-radius:8px;margin:4px 0;cursor:pointer;color:#dbeafe}.nav.active,.nav:hover{background:#ffffff20;color:white}.group{font-size:10px;letter-spacing:1.2px;text-transform:uppercase;color:#9db4cf;padding:18px 12px 6px}.main{flex:1;min-width:0}.top{height:72px;background:white;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;padding:0 28px}.top input{width:min(360px,45vw);border:1px solid var(--line);border-radius:9px;padding:11px}.content{padding:28px;max-width:1500px;margin:auto}.heading{display:flex;justify-content:space-between;align-items:center;margin-bottom:22px}.heading h1{font-size:24px;margin:0}.muted{color:var(--muted)}.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:15px}.metric,.panel,.card{background:white;border:1px solid var(--line);border-radius:11px;padding:18px;box-shadow:0 2px 8px #10182808}.metric{border-left:4px solid var(--navy)}.metric:nth-child(2){border-left-color:var(--yellow)}.metric:nth-child(3){border-left-color:var(--green)}.metric:nth-child(4){border-left-color:#ea580c}.metric:nth-child(5){border-left-color:var(--red)}.metric:nth-child(6){border-left-color:#64748b}.metric label{font-size:12px;color:var(--muted)}.metric strong{display:block;font-size:27px;margin-top:9px}.cols{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-top:18px}.panel h3{margin:0 0 15px;font-size:15px}.rowitem{padding:12px 0;border-top:1px solid #f0f2f5;display:flex;justify-content:space-between;gap:10px}.kanban{display:grid;grid-template-columns:repeat(6,minmax(180px,1fr));gap:10px;overflow:auto}.lane{background:#eef2f7;border-radius:10px;padding:10px;min-height:260px}.lane h3{font-size:12px;margin:3px 2px 12px}.lead{background:white;border:1px solid var(--line);border-radius:9px;padding:12px;margin-bottom:9px;cursor:grab}.lead b{display:block;margin-bottom:5px}.tag{font-size:10px;padding:4px 7px;border-radius:20px;background:#eaf1fb;color:var(--navy);display:inline-block;margin-top:7px}.tablewrap{overflow:auto;background:white;border:1px solid var(--line);border-radius:10px}table{width:100%;border-collapse:collapse;min-width:720px}th,td{text-align:left;padding:14px;border-bottom:1px solid #eef0f3}th{font-size:11px;text-transform:uppercase;letter-spacing:.5px;color:var(--muted);background:#fafbfc}td{font-size:13px}.status{border-radius:20px;padding:5px 8px;background:#e8f7ef;color:#087443;font-size:11px}.empty{padding:28px;text-align:center;color:var(--muted)}.modalback{position:fixed;inset:0;background:#10182880;display:none;align-items:center;justify-content:center;padding:18px;z-index:5}.modal{background:white;border-radius:14px;padding:22px;width:min(560px,100%);max-height:90vh;overflow:auto}.modal h2{margin:0 0 18px}.fields{display:grid;grid-template-columns:1fr 1fr;gap:12px}.fields label{font-size:12px;color:var(--muted)}.fields input,.fields select,.fields textarea{width:100%;padding:10px;border:1px solid var(--line);border-radius:8px;margin-top:5px}.fields textarea{min-height:75px}.span2{grid-column:1/-1}.actions{display:flex;justify-content:flex-end;gap:8px;margin-top:18px}.secondary{background:#eef2f7;color:var(--ink)}.toast{position:fixed;right:22px;bottom:22px;background:#087443;color:white;padding:12px 18px;border-radius:9px;display:none;z-index:8}.pill{font-size:11px;color:var(--muted);background:#f2f4f7;padding:5px 8px;border-radius:20px}@media(max-width:850px){.side{width:190px}.grid{grid-template-columns:repeat(2,1fr)}.cols{grid-template-columns:1fr}.content{padding:18px}}@media(max-width:600px){.side{width:62px;padding:15px 7px}.brand{font-size:0;padding:8px}.brand:after{content:"🇪🇸";font-size:23px}.brand small,.nav .txt,.group{display:none}.nav{text-align:center;font-size:18px;padding:12px 4px}.top{padding:0 12px}.content{padding:14px}.grid{grid-template-columns:1fr 1fr;gap:8px}.metric{padding:12px}.metric strong{font-size:20px}.heading h1{font-size:20px}.fields{grid-template-columns:1fr}.span2{grid-column:auto}}
</style></head><body><div class="app"><aside class="side"><div class="brand">🇪🇸 España Directa<small>CRM · Gestión integral</small></div>
<div class="group">General</div><div class="nav active" data-page="dashboard">▦ <span class="txt">Dashboard</span></div>
<div class="group">Comercial</div><div class="nav" data-page="leads">◎ <span class="txt">Leads</span></div>
<div class="group">Operativa</div><div class="nav" data-page="clientes">♙ <span class="txt">Clientes</span></div><div class="nav" data-page="expedientes">▤ <span class="txt">Expedientes</span></div>
<div class="group">Económico</div><div class="nav" data-page="facturacion">€ <span class="txt">Facturación</span></div><div class="nav" data-page="pagos">↗ <span class="txt">Pagos</span></div>
<div class="group">Seguimiento</div><div class="nav" data-page="seguimientos">◷ <span class="txt">Seguimientos</span></div></aside>
<main class="main"><header class="top"><strong id="topTitle">Dashboard</strong><input id="search" placeholder="Buscar clientes, leads o facturas…"><span class="pill" id="userBadge">Administración</span></header><section class="content" id="view"></section></main></div>
<div class="modalback" id="modalback"><div class="modal"><h2 id="modalTitle">Nuevo registro</h2><form id="recordForm"><div class="fields" id="formFields"></div><div class="actions"><button type="button" class="secondary" onclick="closeModal()">Cancelar</button><button type="submit">Guardar</button></div></form></div></div><div class="toast" id="toast"></div>
<script>
const STORE='ed_crm_v1';const stages=['Contactado','Interesado','Propuesta enviada','Negociación','Cerrado ganado','Cerrado perdido'];const phases=['Documentación pendiente','Documentación recibida','Revisión documental','Preparación de solicitud','Presentado','En trámite','Favorable','Finalizado'];
let db=JSON.parse(localStorage.getItem(STORE)||'{"leads":[],"clientes":[],"expedientes":[],"facturas":[],"pagos":[],"seguimientos":[]}');let page='dashboard',formType='';
function save(){localStorage.setItem(STORE,JSON.stringify(db));render()}function esc(s=''){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function money(n){return Number(n||0).toLocaleString('es-ES',{minimumFractionDigits:0,maximumFractionDigits:2})+' €'}function date(s){return s?new Date(s+'T00:00:00').toLocaleDateString('es-ES'):'—'}function toast(s){let t=document.getElementById('toast');t.textContent=s;t.style.display='block';setTimeout(()=>t.style.display='none',2400)}
function head(title,sub,btn=''){return `<div class="heading"><div><h1>${title}</h1><div class="muted" style="margin-top:6px">${sub}</div></div>${btn}</div>`}
function metric(label,value){return `<div class="metric"><label>${label}</label><strong>${value}</strong></div>`}
function render(){document.querySelectorAll('.nav').forEach(n=>n.classList.toggle('active',n.dataset.page===page));document.getElementById('topTitle').textContent=({dashboard:'Dashboard',leads:'Comercial · Leads',clientes:'Operativa · Clientes',expedientes:'Operativa · Expedientes',facturacion:'Económico · Facturación',pagos:'Económico · Pagos',seguimientos:'Seguimiento'})[page];let v=document.getElementById('view');if(page==='dashboard'){let pending=db.facturas.filter(x=>x.estado!=='Cobrada').reduce((a,x)=>a+Number(x.importe),0),paid=db.pagos.filter(x=>x.estado==='Confirmado').reduce((a,x)=>a+Number(x.importe),0);v.innerHTML=head('Resumen ejecutivo','Actividad comercial y operativa de España Directa')+`<div class="grid">${metric('Leads activos',db.leads.filter(x=>!x.etapa.startsWith('Cerrado')).length)}${metric('Propuestas enviadas',db.leads.filter(x=>x.etapa==='Propuesta enviada').length)}${metric('Clientes activos',db.clientes.length)}${metric('Expedientes abiertos',db.expedientes.filter(x=>x.fase!=='Finalizado').length)}${metric('Pendiente de cobro',money(pending))}${metric('Cobrado total',money(paid))}</div><div class="cols"><div class="panel"><h3>Últimas incorporaciones</h3>${db.clientes.slice(-5).reverse().map(c=>`<div class="rowitem"><span><b>${esc(c.nombre)}</b><br><small class="muted">${esc(c.servicio||'Servicio pendiente')}</small></span><span class="status">Cliente</span></div>`).join('')||'<div class="empty">Todavía no hay clientes.</div>'}</div><div class="panel"><h3>Próximos seguimientos</h3>${db.seguimientos.filter(s=>s.proximo).sort((a,b)=>a.proximo.localeCompare(b.proximo)).slice(0,5).map(s=>`<div class="rowitem"><span><b>${esc(s.contacto)}</b><br><small class="muted">${esc(s.tipo)} · ${esc(s.notas||'')}</small></span><span>${date(s.proximo)}</span></div>`).join('')||'<div class="empty">No hay seguimientos programados.</div>'}</div></div>`}
if(page==='leads'){v.innerHTML=head('Leads','Gestiona oportunidades y convierte contactos en clientes.',`<button onclick="openForm('lead')">+ Nuevo lead</button>`)+`<div class="kanban">${stages.map((s,i)=>`<div class="lane" data-stage="${s}" ondragover="event.preventDefault()" ondrop="dropLead(event,'${s.replace(/'/g,"\\'")}')"><h3>${s} <span class="pill">${db.leads.filter(l=>l.etapa===s).length}</span></h3>${db.leads.filter(l=>l.etapa===s).map(l=>`<div class="lead" draggable="true" ondragstart="event.dataTransfer.setData('text/plain','${l.id}')"><b>${esc(l.nombre)}</b><span class="muted">${esc(l.servicio||'Sin servicio')}</span><br><span class="tag">${esc(l.origen||'Web')}</span><div style="margin-top:8px"><button class="secondary" onclick="event.stopPropagation();editLead('${l.id}')">Editar</button></div></div>`).join('')}</div>`).join('')}</div>`}
if(page==='clientes'){v.innerHTML=head('Clientes','Fichas y situación de los servicios contratados.',`<button onclick="openForm('cliente')">+ Nuevo cliente</button>`)+table(['Cliente','Servicio','Teléfono','Email','Expedientes','Acción'],db.clientes.map(c=>[`<b>${esc(c.nombre)}</b><br><small class="muted">${esc(c.nacionalidad||'')}</small>`,esc(c.servicio||'—'),esc(c.telefono||'—'),esc(c.email||'—'),db.expedientes.filter(e=>e.clienteId===c.id).length,`<button class="secondary" onclick="viewClient('${c.id}')">Ver ficha →</button>`]))}
if(page==='expedientes'){v.innerHTML=head('Expedientes','Seguimiento de fases de tramitación.',`<button onclick="openForm('expediente')">+ Nuevo expediente</button>`)+`<div class="kanban" style="grid-template-columns:repeat(4,minmax(180px,1fr))">${phases.map(s=>`<div class="lane"><h3>${s} <span class="pill">${db.expedientes.filter(e=>e.fase===s).length}</span></h3>${db.expedientes.filter(e=>e.fase===s).map(e=>`<div class="lead"><b>${esc(db.clientes.find(c=>c.id===e.clienteId)?.nombre||'Cliente')}</b><span class="muted">${esc(e.tipo)}</span><br><small>${date(e.fecha)}</small><br><select onchange="setPhase('${e.id}',this.value)" style="width:100%;margin-top:8px;padding:6px;border:1px solid var(--line);border-radius:6px">${phases.map(p=>`<option ${p===e.fase?'selected':''}>${p}</option>`).join('')}</select></div>`).join('')}</div>`).join('')}</div>`}
if(page==='facturacion'){v.innerHTML=head('Facturación','Control de facturas y estados de cobro.',`<button onclick="openForm('factura')">+ Nueva factura</button>`)+`<div class="grid" style="margin-bottom:18px">${metric('Facturado',money(db.facturas.reduce((a,x)=>a+Number(x.importe),0)))}${metric('Pendiente de cobro',money(db.facturas.filter(x=>x.estado!=='Cobrada').reduce((a,x)=>a+Number(x.importe),0)))}${metric('Facturas emitidas',db.facturas.length)}</div>`+table(['Nº Factura','Cliente','Concepto','Importe','Fecha','Estado','Acción'],db.facturas.map(f=>[esc(f.numero),esc(db.clientes.find(c=>c.id===f.clienteId)?.nombre||'—'),esc(f.concepto),money(f.importe),date(f.fecha),esc(f.estado),`<button class="secondary" onclick="cycleInvoice('${f.id}')">Cambiar estado</button>`]))}
if(page==='pagos'){v.innerHTML=head('Pagos','Registro de cobros recibidos y pendientes.',`<button onclick="openForm('pago')">+ Registrar pago</button>`)+table(['Cliente','Concepto','Importe','Método','Fecha','Estado'],db.pagos.slice().sort((a,b)=>b.fecha.localeCompare(a.fecha)).map(p=>[esc(db.clientes.find(c=>c.id===p.clienteId)?.nombre||'—'),esc(p.concepto),money(p.importe),esc(p.metodo),date(p.fecha),esc(p.estado)]))}
if(page==='seguimientos'){v.innerHTML=head('Seguimientos','Historial de contacto y próximas acciones.',`<button onclick="openForm('seguimiento')">+ Registrar seguimiento</button>`)+table(['Contacto','Tipo','Fecha','Próximo contacto','Notas'],db.seguimientos.map(s=>[esc(s.contacto),esc(s.tipo),date(s.fecha),date(s.proximo),esc(s.notas||'')]))}
}
function table(headers,rows){return `<div class="tablewrap"><table><thead><tr>${headers.map(h=>`<th>${h}</th>`).join('')}</tr></thead><tbody>${rows.map(r=>`<tr>${r.map(x=>`<td>${x}</td>`).join('')}</tr>`).join('')||`<tr><td colspan="${headers.length}" class="empty">Sin registros todavía.</td></tr>`}</tbody></table></div>`}
function openForm(type){formType=type;let config={lead:['Nuevo lead',[['nombre','Nombre'],['telefono','Teléfono'],['email','Email'],['origen','Origen','select','Web,WhatsApp,Instagram,TikTok,Email,Referido,Colaborador'],['servicio','Servicio de interés'],['etapa','Etapa','select',stages.join(',')],['notas','Notas','textarea']]],cliente:['Nuevo cliente',[['nombre','Nombre'],['nacionalidad','Nacionalidad'],['telefono','Teléfono'],['email','Email'],['documento','DNI/NIE/Pasaporte'],['servicio','Servicio contratado'],['direccion','Dirección'],['notas','Notas','textarea']]],expediente:['Nuevo expediente',[['clienteId','Cliente','select',db.clientes.map(c=>c.id+'|'+c.nombre).join(',')],['tipo','Tipo de trámite'],['fase','Fase','select',phases.join(',')],['fecha','Fecha de apertura','date'],['notas','Notas','textarea']]],factura:['Nueva factura',[['clienteId','Cliente','select',db.clientes.map(c=>c.id+'|'+c.nombre).join(',')],['concepto','Concepto'],['importe','Importe (€)','number'],['fecha','Fecha','date'],['estado','Estado','select','Pendiente,Cobrada,Parcial']]],pago:['Registrar pago',[['clienteId','Cliente','select',db.clientes.map(c=>c.id+'|'+c.nombre).join(',')],['concepto','Concepto'],['importe','Importe (€)','number'],['metodo','Método','select','Transferencia,Tarjeta,Efectivo,Bizum,PayPal'],['fecha','Fecha','date'],['estado','Estado','select','Confirmado,Pendiente']]],seguimiento:['Registrar seguimiento',[['contacto','Contacto'],['tipo','Tipo','select','Llamada,WhatsApp,Email,Reunión,Videollamada'],['fecha','Fecha','date'],['proximo','Próximo contacto','date'],['notas','Notas','textarea']]]};let [title,fields]=config[type];document.getElementById('modalTitle').textContent=title;document.getElementById('formFields').innerHTML=fields.map(([name,label,kind,opts])=>`<label class="${kind==='textarea'?'span2':''}">${label}${kind==='select'?`<select name="${name}" required>${(opts||'').split(',').filter(Boolean).map(o=>{let [val,txt]=o.split('|');return `<option value="${val}">${txt||val}</option>`}).join('')}</select>`:kind==='textarea'?`<textarea name="${name}"></textarea>`:`<input name="${name}" type="${kind||'text'}" ${['number','date'].includes(kind)?'':''} ${name==='nombre'?'required':''}>`}</label>`).join('');document.getElementById('modalback').style.display='flex'}
function closeModal(){document.getElementById('modalback').style.display='none'}function id(){return crypto.randomUUID()}function editLead(x){let l=db.leads.find(a=>a.id===x);openForm('lead');document.getElementById('modalTitle').textContent='Editar lead';Object.entries(l).forEach(([k,v])=>{let el=document.querySelector(`[name="${k}"]`);if(el)el.value=v});formType='editlead:'+x}
document.getElementById('recordForm').onsubmit=e=>{e.preventDefault();let d=Object.fromEntries(new FormData(e.target));if(formType.startsWith('editlead:')){let l=db.leads.find(x=>x.id===formType.split(':')[1]);Object.assign(l,d)}else if(formType==='lead'){db.leads.push({id:id(),...d,etapa:d.etapa||'Contactado'});if(d.etapa==='Cerrado ganado')convertLead(db.leads.at(-1))}else if(formType==='cliente'){db.clientes.push({id:id(),...d,fechaAlta:new Date().toISOString().slice(0,10)})}else if(formType==='expediente'){db.expedientes.push({id:id(),...d})}else if(formType==='factura'){let n=db.facturas.length+1;db.facturas.push({id:id(),...d,numero:'FAC-'+String(n).padStart(4,'0')})}else if(formType==='pago'){db.pagos.push({id:id(),...d})}else if(formType==='seguimiento'){db.seguimientos.push({id:id(),...d})}closeModal();save();toast('Registro guardado correctamente');e.target.reset()};
function convertLead(l){let c={id:id(),nombre:l.nombre,telefono:l.telefono,email:l.email,servicio:l.servicio,notas:l.notas,fechaAlta:new Date().toISOString().slice(0,10)};db.clientes.push(c);db.expedientes.push({id:id(),clienteId:c.id,tipo:l.servicio,fase:phases[0],fecha:c.fechaAlta});l.etapa='Cerrado ganado'}
function dropLead(e,stage){e.preventDefault();let l=db.leads.find(x=>x.id===e.dataTransfer.getData('text/plain'));if(!l)return;l.etapa=stage;if(stage==='Cerrado ganado'&&!l.convertido){convertLead(l);l.convertido=true}save();toast('Etapa actualizada')}
function setPhase(i,p){let x=db.expedientes.find(e=>e.id===i);x.fase=p;save()}function cycleInvoice(i){let x=db.facturas.find(f=>f.id===i);x.estado=({'Pendiente':'Cobrada','Cobrada':'Parcial','Parcial':'Pendiente'})[x.estado]||'Pendiente';save()}
function viewClient(i){let c=db.clientes.find(x=>x.id===i);alert(`${c.nombre}\nNacionalidad: ${c.nacionalidad||'—'}\nServicio: ${c.servicio||'—'}\nTeléfono: ${c.telefono||'—'}\nEmail: ${c.email||'—'}\n\nExpedientes: ${db.expedientes.filter(e=>e.clienteId===i).length}\nPagos: ${db.pagos.filter(p=>p.clienteId===i).length}\n\nFicha ampliada y documentación: siguiente fase de implementación.`)}
document.querySelectorAll('.nav').forEach(n=>n.onclick=()=>{page=n.dataset.page;render()});document.getElementById('search').oninput=e=>{let q=e.target.value.toLowerCase().trim();if(q.length<2)return;let hits=[...db.clientes.map(x=>({tipo:'Cliente',nombre:x.nombre})),...db.leads.map(x=>({tipo:'Lead',nombre:x.nombre})),...db.facturas.map(x=>({tipo:'Factura',nombre:x.numero}))].filter(x=>x.nombre.toLowerCase().includes(q));toast(hits.length?hits.slice(0,4).map(x=>x.tipo+': '+x.nombre).join(' · '):'Sin resultados')};render();
</script></body></html>
